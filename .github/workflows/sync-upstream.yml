name: Sync and Deploy Sub-Store

on:
  schedule:
    # 每天 UTC 16:00 = 北京 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制部署（即使无更新）'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WORKER_NAME: sub-store-backend
  FRONTEND_WORKER_NAME: sub-store

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sub-store-workers
        uses: actions/checkout@v4
        with:
          path: sub-store-workers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Sub-Store (upstream)
        uses: actions/checkout@v4
        with:
          repository: sub-store-org/Sub-Store
          path: Sub-Store
          fetch-depth: 1

      - name: Get upstream version
        id: upstream
        working-directory: Sub-Store
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream: $VERSION ($SHA)"

      - name: Read last synced version
        id: last
        working-directory: sub-store-workers
        run: |
          if [ -f .upstream-sha ]; then
            LAST=$(cat .upstream-sha)
          else
            LAST="none"
          fi
          echo "sha=$LAST" >> "$GITHUB_OUTPUT"
          echo "Last synced: $LAST"

      - name: Check if update needed
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.last.outputs.sha }}" ] && [ "$FORCE" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No update needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Update needed"
          fi

      - name: Setup Node
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sub-store-workers/package-lock.json

      - name: Enable corepack
        if: steps.check.outputs.needed == 'true'
        run: corepack enable

      - name: Configure upstream pnpm build scripts
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pnpm-workspace.yaml';
          const approved = ['core-js', 'esbuild', 'nodemon'];
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          text = text.replace(/^onlyBuiltDependencies:\n(?:[ \t].*(?:\n|$))*/m, '');
          if (!/^packages:/m.test(text)) {
            text = `packages:\n  - .\n${text.trim() ? `\n${text.trimStart()}` : ''}`;
          }
          if (!/^allowBuilds:/m.test(text)) {
            text = `${text.replace(/\s*$/, '')}\nallowBuilds:\n`;
          }
          for (const name of approved) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^(\\s*${escaped}\\s*:\\s*).*$`, 'm');
            if (pattern.test(text)) {
              text = text.replace(pattern, `$1true`);
            } else {
              text = text.replace(/^allowBuilds:\n/m, `allowBuilds:\n  ${name}: true\n`);
            }
          }
          fs.writeFileSync(file, text);
          NODE
          cat pnpm-workspace.yaml

      - name: Install upstream deps
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm install --no-frozen-lockfile

      - name: Run upstream tests
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm test

      - name: Install workers deps
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm ci

      - name: Build worker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm run build

      - name: Run Worker runtime tests
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npx vitest run

      - name: Check worker bundle size
        if: steps.check.outputs.needed == 'true'
        id: size
        working-directory: sub-store-workers
        run: |
          FILES=(dist/worker.js dist/quickjs.wasm)
          BYTES=0
          GZIP_BYTES=0
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Expected Worker upload module is missing: $FILE"
              exit 1
            fi
            BYTES=$((BYTES + $(stat -c %s "$FILE")))
            GZIP_BYTES=$((GZIP_BYTES + $(gzip -c "$FILE" | wc -c)))
          done
          KB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1024}")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1024/1024}")
          GZIP_KB=$(awk "BEGIN {printf \"%.1f\", $GZIP_BYTES/1024}")
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "kb=$KB" >> "$GITHUB_OUTPUT"
          echo "mb=$MB" >> "$GITHUB_OUTPUT"
          echo "gzip_kb=$GZIP_KB" >> "$GITHUB_OUTPUT"
          echo "Worker upload raw: ${KB} KB (${MB} MB), compressed upper bound: ${GZIP_KB} KB"
          FREE_LIMIT=$((3 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$FREE_LIMIT" ]; then
            echo "::error::Worker upload compressed size ${GZIP_KB} KB exceeds the Workers Free 3 MiB limit"
            exit 1
          fi

      - name: Resolve existing KV binding
        if: steps.check.outputs.needed == 'true'
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          RESPONSE=$(curl --fail-with-body -sS "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          if ! jq -e '.success == true' >/dev/null <<<"$RESPONSE"; then
            echo "Cloudflare did not return settings for ${WORKER_NAME}. The existing Worker must be present before migration."
            jq -c '.errors // []' <<<"$RESPONSE"
            exit 1
          fi
          KV_ID=$(jq -r '.result.bindings[]? | select(.type == "kv_namespace" and .name == "SUB_STORE_DATA") | .namespace_id' <<<"$RESPONSE" | head -n 1)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Existing Worker ${WORKER_NAME} has no SUB_STORE_DATA KV binding."
            exit 1
          fi
          echo "namespace_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "Reusing existing SUB_STORE_DATA KV namespace"

      - name: Generate Wrangler config
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        run: |
          cat > wrangler.toml <<TOML
          name = "sub-store-backend"
          main = "dist/worker.js"
          compatibility_date = "2026-09-04"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = false
          keep_vars = true

          [secrets]
          required = ["SUB_STORE_FRONTEND_BACKEND_PATH"]

          [[kv_namespaces]]
          binding = "SUB_STORE_DATA"
          id = "${KV_NAMESPACE_ID}"

          [triggers]
          crons = ["0 21 * * *"]

          [vars]
          SCRIPT_ENGINE = "quickjs"
          SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
          SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/aenerv7/sub-store-workers@main/png/cloudflare.png"

          [observability]
          enabled = true

          [[durable_objects.bindings]]
          name = "SUB_STORE_COORDINATOR"
          class_name = "SubStoreCoordinator"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["SubStoreCoordinator"]
          TOML
          echo "Generated Wrangler config for ${WORKER_NAME} with the existing KV binding"

      - name: Deploy Worker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIOUS=$(npx wrangler deployments list --name "$WORKER_NAME" --json | jq -r '((max_by(.created_on) // {}) | ([.versions[]?] | max_by(.percentage).version_id)) // empty')
          if [ -n "$PREVIOUS" ]; then
            printf '%s\n' "$PREVIOUS" > /tmp/previous-worker-version
          else
            rm -f /tmp/previous-worker-version
          fi
          npx wrangler deploy --keep-vars

      - name: Verify Worker HTTP health
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_HEALTH_URL:-}" ]; then
            echo "WORKER_HEALTH_URL is not configured; skipping external HTTP health check"
            exit 0
          fi
          RESPONSE=$(curl --fail-with-body -sS --max-time 20 -D /tmp/worker-headers "$WORKER_HEALTH_URL/_health")
          STATUS=$(awk 'NR==1 {print $2}' /tmp/worker-headers)
          test "$STATUS" = "200"
          jq -e '.status == "ok" and .storage == "durable-object"' <<<"$RESPONSE"

      - name: Verify Worker bindings, Durable Object and secrets
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          RESPONSE=$(curl --fail-with-body -sS "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          jq -e '.success == true' >/dev/null <<<"$RESPONSE"
          jq -e '.result.bindings[]? | select(.type == "kv_namespace" and .name == "SUB_STORE_DATA")' >/dev/null <<<"$RESPONSE"
          jq -e '.result.bindings[]? | select(.type == "durable_object_namespace" and .name == "SUB_STORE_COORDINATOR")' >/dev/null <<<"$RESPONSE"
          echo "Worker ${WORKER_NAME} is deployed with SUB_STORE_DATA"

          SECRETS=$(npx wrangler secret list)
          jq -e 'any(.[]; .name == "SUB_STORE_FRONTEND_BACKEND_PATH")' >/dev/null <<<"$SECRETS"
          echo "Existing Worker Secrets are preserved; SUB_STORE_FRONTEND_BACKEND_PATH is present"

      - name: Roll back failed deployment
        if: failure() && steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/previous-worker-version ]; then
            echo "No previous Worker version was recorded; rollback skipped"
            exit 0
          fi
          PREVIOUS=$(cat /tmp/previous-worker-version)
          if [ -z "$PREVIOUS" ]; then
            echo "Previous Worker version is empty; rollback skipped"
            exit 0
          fi
          npx wrangler rollback "$PREVIOUS" --name "$WORKER_NAME" --message "Automated rollback after failed verification" --yes

      - name: Write job summary
        if: always() && steps.check.outputs.needed == 'true'
        run: |
          {
            echo "## Sub-Store Worker 同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Worker | \`${WORKER_NAME}\` |"
            echo "| 上游版本 | \`${{ steps.upstream.outputs.version }}\` |"
            echo "| 上游 SHA | \`${{ steps.upstream.outputs.sha }}\` |"
            echo "| 上次同步 SHA | \`${{ steps.last.outputs.sha }}\` |"
            echo "| Worker 原始大小 | ${{ steps.size.outputs.kb }} KB (${{ steps.size.outputs.mb }} MB) |"
            echo "| Worker gzip 大小 | ${{ steps.size.outputs.gzip_kb }} KB |"
            echo "| 前端 | 由后续 Static Assets job 独立检查和部署 |"
            echo "| Custom Domain | 未配置（请在 Cloudflare Dashboard 手动绑定） |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update upstream-sha marker
        if: success() && steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha
          git commit -m "chore: sync upstream to ${{ steps.upstream.outputs.version }} [skip ci]" || exit 0
          git push origin HEAD:main

  frontend:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout sub-store-workers
        uses: actions/checkout@v4
        with:
          path: sub-store-workers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest front-end release
        id: release
        working-directory: sub-store-workers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE=$(gh api repos/sub-store-org/Sub-Store-Front-End/releases/latest)
          TAG=$(jq -r '.tag_name' <<<"$RELEASE")
          ASSET_URL=$(jq -r '.assets[]? | select(.name == "dist.zip") | .browser_download_url' <<<"$RELEASE" | head -n 1)
          DIGEST=$(jq -r '.assets[]? | select(.name == "dist.zip") | .digest // empty' <<<"$RELEASE" | head -n 1)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ] || [ -z "$ASSET_URL" ]; then
            echo "::error::The latest Sub-Store-Front-End release has no dist.zip asset"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The dist.zip release asset has no valid SHA-256 digest"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Latest front-end release: $TAG"

      - name: Check if front-end update is needed
        id: check
        working-directory: sub-store-workers
        env:
          FORCE: ${{ inputs.force }}
          LATEST_TAG: ${{ steps.release.outputs.tag }}
          LATEST_FINGERPRINT: ${{ steps.release.outputs.fingerprint }}
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '\r\n' < .frontend-upstream-version 2>/dev/null || true)
          if [ "$CURRENT" = "$LATEST_FINGERPRINT" ] && [ "$FORCE" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Front-end is already at $LATEST_TAG"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Front-end update needed: ${CURRENT:-none} -> $LATEST_TAG"
          fi

      - name: Setup Node
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sub-store-workers/package-lock.json

      - name: Install Wrangler
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm ci

      - name: Download and verify front-end release
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
          EXPECTED_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p .frontend-release
          curl --fail-with-body -L --retry 3 --max-time 120 "$ASSET_URL" -o /tmp/sub-store-frontend.zip
          EXPECTED=${EXPECTED_DIGEST#sha256:}
          ACTUAL=$(sha256sum /tmp/sub-store-frontend.zip | awk '{print $1}')
          if [ "${ACTUAL,,}" != "${EXPECTED,,}" ]; then
            echo "::error::Front-end release digest mismatch"
            exit 1
          fi
          ARCHIVE_PATHS=$(unzip -Z1 /tmp/sub-store-frontend.zip)
          if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' <<<"$ARCHIVE_PATHS"; then
            echo "::error::Front-end release contains an unsafe archive path"
            exit 1
          fi
          unzip -q /tmp/sub-store-frontend.zip -d .frontend-release
          test -f .frontend-release/dist/index.html
          grep -qi '<title>Sub Store</title>' .frontend-release/dist/index.html

      - name: Check Static Assets Free limits
        if: steps.check.outputs.needed == 'true'
        id: assets
        working-directory: sub-store-workers
        run: |
          set -euo pipefail
          FILE_COUNT=$(find .frontend-release/dist -type f | wc -l)
          TOTAL_BYTES=$(du -sb .frontend-release/dist | awk '{print $1}')
          MAX_BYTES=$(find .frontend-release/dist -type f -printf '%s\n' | sort -nr | head -n 1)
          test "$FILE_COUNT" -gt 0
          if [ "$FILE_COUNT" -gt 20000 ]; then
            echo "::error::Static Assets file count $FILE_COUNT exceeds the Workers Free limit of 20,000"
            exit 1
          fi
          if [ "$MAX_BYTES" -gt $((25 * 1024 * 1024)) ]; then
            echo "::error::A Static Assets file exceeds the 25 MiB per-file limit"
            exit 1
          fi
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_bytes=$TOTAL_BYTES" >> "$GITHUB_OUTPUT"
          echo "Static Assets: $FILE_COUNT files, $TOTAL_BYTES bytes"

      - name: Deploy front-end Static Assets Worker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIOUS=""
          if DEPLOYMENTS=$(npx wrangler deployments list --name "$FRONTEND_WORKER_NAME" --json 2>/dev/null); then
            PREVIOUS=$(jq -r '((max_by(.created_on) // {}) | ([.versions[]?] | max_by(.percentage).version_id)) // empty' <<<"$DEPLOYMENTS")
          fi
          if [ -n "$PREVIOUS" ]; then
            printf '%s\n' "$PREVIOUS" > /tmp/previous-frontend-version
          fi
          npx wrangler deploy --config wrangler.frontend.jsonc

      - name: Verify front-end Static Assets
        if: steps.check.outputs.needed == 'true'
        id: verify
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          RESPONSE=$(curl --fail-with-body -sS "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          jq -e '.success == true' >/dev/null <<<"$RESPONSE"
          SUBDOMAIN=$(jq -r '.result.subdomain' <<<"$RESPONSE")
          test -n "$SUBDOMAIN"
          FRONTEND_URL="https://${FRONTEND_WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

          for ATTEMPT in 1 2 3 4 5 6; do
            ROOT_STATUS=$(curl -sS --max-time 20 -o /tmp/frontend-root -w '%{http_code}' "$FRONTEND_URL/" || true)
            SPA_STATUS=$(curl -sS --max-time 20 -H 'Sec-Fetch-Mode: navigate' -o /tmp/frontend-spa -w '%{http_code}' "$FRONTEND_URL/settings" || true)
            if [ "$ROOT_STATUS" = "200" ] && [ "$SPA_STATUS" = "200" ] && \
              grep -qi '<title>Sub Store</title>' /tmp/frontend-root && \
              grep -qi '<title>Sub Store</title>' /tmp/frontend-spa; then
              echo "Front-end verified at $FRONTEND_URL"
              exit 0
            fi
            echo "Verification attempt ${ATTEMPT}/6 returned root=$ROOT_STATUS spa=$SPA_STATUS"
            if [ "$ATTEMPT" != "6" ]; then sleep 5; fi
          done
          echo "::error::Front-end Static Assets verification failed"
          exit 1

      - name: Roll back failed front-end deployment
        if: failure() && steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/previous-frontend-version ]; then
            echo "No previous front-end version was recorded; rollback skipped"
            exit 0
          fi
          PREVIOUS=$(cat /tmp/previous-frontend-version)
          npx wrangler rollback "$PREVIOUS" --name "$FRONTEND_WORKER_NAME" --message "Automated rollback after failed Static Assets verification" --yes

      - name: Write front-end job summary
        if: always() && steps.check.outputs.needed == 'true'
        run: |
          {
            echo "## Sub-Store 前端同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| Static Assets Worker | \`${FRONTEND_WORKER_NAME}\` |"
            echo "| 上游 Release | \`${{ steps.release.outputs.tag }}\` |"
            echo "| 文件数 | ${{ steps.assets.outputs.file_count }} |"
            echo "| 静态资源大小 | ${{ steps.assets.outputs.total_bytes }} bytes |"
            echo "| workers.dev | ${{ steps.verify.outputs.url }} |"
            echo "| 计费路径 | 纯 Static Assets，不执行 Worker 脚本 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update front-end release marker
        if: success() && steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          echo "${{ steps.release.outputs.fingerprint }}" > .frontend-upstream-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .frontend-upstream-version
          git commit -m "chore: sync front-end to ${{ steps.release.outputs.tag }} [skip ci]" || exit 0
          git push origin HEAD:main
